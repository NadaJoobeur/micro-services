name: Publish Java Package with Maven

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        module: [config-server, discovery, gateway, school, student]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # server-id must match the <id> used in <distributionManagement> in each pom.xml
          server-id: github

      - name: Build and publish ${{ matrix.module }}
        working-directory: ./${{ matrix.module }}
        run: mvn --batch-mode deploy -DskipTests
        env:
          # Using a Personal Access Token instead of the default GITHUB_TOKEN,
          # which can be unreliable for GitHub Packages Maven authentication.
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}